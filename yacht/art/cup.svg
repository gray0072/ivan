<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250" width="200" height="250">
  <defs>
    <!-- the body as a cylinder: dark at the edges, a soft shine left of the middle -->
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f210f"/>
      <stop offset="0.16" stop-color="#7a4520"/>
      <stop offset="0.36" stop-color="#b0703a"/>
      <stop offset="0.56" stop-color="#8a5226"/>
      <stop offset="0.86" stop-color="#55301a"/>
      <stop offset="1" stop-color="#2e180b"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b160a"/>
      <stop offset="0.36" stop-color="#7d4a22"/>
      <stop offset="1" stop-color="#1f0f06"/>
    </linearGradient>
    <radialGradient id="inside" cx="0.5" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#0d0603"/>
      <stop offset="1" stop-color="#2c170b"/>
    </radialGradient>
    <!-- the grain of the leather: fine pebbles lit from the upper left -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.42" numOctaves="3" seed="7" result="n"/>
      <feDiffuseLighting in="n" surfaceScale="1.5" lighting-color="#ffffff" result="l">
        <feDistantLight azimuth="235" elevation="58"/>
      </feDiffuseLighting>
      <feComposite in="l" in2="SourceAlpha" operator="in" result="lit"/>
      <feBlend in="SourceGraphic" in2="lit" mode="multiply"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <!-- the body -->
  <g filter="url(#grain)">
    <path d="M18 34 C20 90 30 170 34 222 A66 15 0 0 0 166 222 C170 170 180 90 182 34 Z" fill="url(#body)"/>
    <!-- the band at the mouth and the band at the foot -->
    <path d="M18 34 C18.6 46 19.6 58 20.6 70 A80 15 0 0 0 179.4 70 C180.4 58 181.4 46 182 34 Z" fill="url(#band)"/>
    <path d="M31.5 196 C32.4 206 33.3 214 34 222 A66 15 0 0 0 166 222 C166.7 214 167.6 206 168.5 196 A68 14 0 0 1 31.5 196 Z" fill="url(#band)"/>
  </g>

  <!-- the worn seam down the middle of the body -->
  <path d="M100 86 L100 206" stroke="#2a1508" stroke-width="3" opacity="0.65"/>
  <!-- stitches: the seam and round both bands -->
  <path d="M93 90 L93 204 M107 90 L107 204" stroke="#e6cf9e" stroke-width="2.4" stroke-dasharray="7 6" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M24 66 A77 14 0 0 0 176 66" stroke="#e6cf9e" stroke-width="2.4" stroke-dasharray="7 6" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M34 200 A66 13 0 0 0 166 200" stroke="#e6cf9e" stroke-width="2.4" stroke-dasharray="7 6" stroke-linecap="round" fill="none" opacity="0.9"/>

  <!-- the mouth -->
  <ellipse cx="100" cy="34" rx="82" ry="20" fill="#6a3c1b"/>
  <ellipse cx="100" cy="34" rx="82" ry="20" fill="none" stroke="#94602f" stroke-width="2"/>
  <ellipse cx="100" cy="35" rx="72" ry="15" fill="url(#inside)"/>
  <path d="M34 39 A70 14 0 0 0 166 39" stroke="#000000" stroke-width="5" fill="none" opacity="0.45" filter="url(#soft)"/>
</svg>
