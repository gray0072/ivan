<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Android home-screen icon: full-bleed square, the artwork scaled into the central safe circle (r ≈ 170) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b4f8a"/>
      <stop offset="0.55" stop-color="#0f2f52"/>
      <stop offset="1" stop-color="#0a1a2e"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfdbe8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#5fd0ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5fd0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <g transform="translate(256 256) scale(0.7) translate(-256 -290)">
    <!-- bubbles -->
    <circle cx="396" cy="112" r="16" fill="none" stroke="#8fe3ff" stroke-width="6" opacity="0.7"/>
    <circle cx="430" cy="160" r="9" fill="none" stroke="#8fe3ff" stroke-width="5" opacity="0.55"/>
    <!-- gamepad -->
    <path fill="url(#pad)" d="M160 172h192c56 0 92 40 104 104l14 76c8 44-18 76-52 76-24 0-40-14-54-36l-18-28H166l-18 28c-14 22-30 36-54 36-34 0-60-32-52-76l14-76c12-64 48-104 104-104z"/>
    <!-- d-pad -->
    <rect x="124" y="248" width="80" height="26" rx="8" fill="#0f2f52"/>
    <rect x="151" y="221" width="26" height="80" rx="8" fill="#0f2f52"/>
    <!-- buttons -->
    <circle cx="352" cy="232" r="17" fill="#ffb627"/>
    <circle cx="388" cy="264" r="17" fill="#ff5d73"/>
    <circle cx="316" cy="264" r="17" fill="#3ddc97"/>
    <circle cx="352" cy="296" r="17" fill="#3fa9f5"/>
    <!-- center -->
    <rect x="232" y="252" width="48" height="16" rx="8" fill="#9fb0c3"/>
  </g>
</svg>
