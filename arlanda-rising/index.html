<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Run Stockholm Arlanda from the forest of 1958 to an Arlanda of 2040: build runways and terminals, hire teams and managers, put in computers, fill the terminals with real shops, court airlines, build the train and survive strikes, fog and snowstorms.">
<title>Arlanda Rising</title>

<body>
<canvas id="map"></canvas>

<div id="hud" hidden>
  <div class="hudRow">
    <button class="chip money" id="moneyChip" data-i18n-title="Money"><span class="ico">💰</span><span class="mwrap"><b id="money"></b><small id="trend"></small></span></button>
    <div class="chip" id="dateChip"><span class="ico">📅</span><b id="date"></b><i class="prog"><i></i></i></div>
    <div class="chip" id="wxChip"><b id="wx"></b></div>
    <div class="chip" id="greenChip" hidden><span class="ico">🌿</span><b></b></div>
  </div>
  <div class="hudRow" id="meters"></div>
  <div class="hudRow right">
    <div class="speeds" role="group">
      <button data-speed="0" data-i18n-title="Stop the time (Space)">⏸</button>
      <button data-speed="1" data-i18n-title="Normal speed">▶</button>
      <button data-speed="2" data-i18n-title="Fast">▶▶</button>
      <button data-speed="3" data-i18n-title="Fastest">▶▶▶</button>
    </div>
    <button class="round" id="roofBtn" data-i18n-title="Roofs on or off: look inside the buildings (R)">🏠</button>
    <button class="round" id="skipBtn" data-i18n-title="Skip to the next task (N)">⏭️</button>
    <button class="round" id="pauseBtn" data-i18n-title="Pause (Esc)">☰</button>
  </div>
</div>

<div id="goalsBox" hidden></div>
<div id="tray" hidden></div>
<div id="planPanel" hidden></div>
<div id="toolbar" hidden></div>
<div id="flightCard" class="card" hidden></div>

<div id="finger" hidden>👆</div>

<div id="overlay" hidden>

  <div id="finance" class="panel wide" hidden></div>
  <div id="airlines" class="panel wide" hidden></div>
  <div id="challenges" class="panel wide" hidden></div>
</div>
