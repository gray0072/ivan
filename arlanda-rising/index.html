<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Run Stockholm Arlanda from the forest of 1958: build the runway, the tower and the terminal, pick stands, fuel the jets, plough the snow and make the airport pay.">
<title>Arlanda Rising</title>
<link rel="icon" type="image/svg+xml" href="icon.svg?v=1">
<link rel="manifest" href="manifest.webmanifest?v=1">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">
<meta name="theme-color" content="#203445">
<link rel="stylesheet" href="styles.css?v=1">
</head>
<body>
<canvas id="map"></canvas>

<div id="hud" hidden>
  <div class="hudRow">
    <button class="chip money" id="moneyChip" data-i18n-title="Money"><span class="ico">💰</span><b id="money"></b></button>
    <div class="chip"><span class="ico">📅</span><b id="date"></b></div>
    <div class="chip" id="wxChip"><b id="wx"></b></div>
  </div>
  <div class="hudRow" id="meters"></div>
  <div class="hudRow right">
    <div class="speeds" role="group">
      <button data-speed="0" data-i18n-title="Stop the time (Space)">⏸</button>
      <button data-speed="1" data-i18n-title="Normal speed">▶</button>
      <button data-speed="2" data-i18n-title="Fast">▶▶</button>
      <button data-speed="3" data-i18n-title="Fastest">▶▶▶</button>
    </div>
    <button class="round" id="skipBtn" data-i18n-title="Skip to the next task (N)">⏭️</button>
    <button class="round" id="pauseBtn" data-i18n-title="Pause (Esc)">☰</button>
  </div>
</div>

<div id="goalsBox" hidden></div>
<div id="tray" hidden></div>
<div id="planPanel" hidden></div>
<div id="toolbar" hidden></div>
<div id="flightCard" class="card" hidden></div>
<div id="decision" class="card" hidden></div>
<div id="hint" hidden></div>
<div id="finger" hidden>👆</div>
<div id="banner"></div>

<div id="overlay" hidden>
  <div id="menu" class="panel" hidden></div>
  <div id="help" class="panel" hidden></div>
  <div id="settings" class="panel" hidden></div>
  <div id="confirm" class="panel" hidden></div>
  <div id="timeline" class="panel wide" hidden></div>
  <div id="missionCard" class="panel" hidden></div>
  <div id="stageIntro" class="panel" hidden></div>
  <div id="stageCard" class="panel" hidden></div>
  <div id="results" class="panel" hidden></div>
  <div id="pause" class="panel" hidden></div>
  <div id="office" class="panel wide" hidden></div>
</div>
